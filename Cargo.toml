[package]
name = "better-git-diff"
version = "0.1.0"
edition = "2021"
authors = ["Matteo Bosshard"]
description = "Token-minimized, human-readable Git diff CLI for terminals and AI workflows"
readme = "README.md"
license = "MIT"
repository = "https://github.com/HardBoss07/better-git-diff"
documentation = "https://github.com/HardBoss07/better-git-diff#readme"
keywords = ["git", "diff", "cli", "ai", "llm"]
categories = ["command-line-utilities", "development-tools"]
exclude = [
    "benchmark_tokens.py",
    "diff*.txt",
    ".vscode/*",
]

[dependencies]
clap = { version = "4.6", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
